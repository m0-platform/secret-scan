###############################################################################
# Reusable Secret Scan (Gitleaks CLI)
#
# Scans commits in a PR or push for accidentally committed secrets — API keys,
# tokens, private keys, connection strings, etc.
#
# Uses the Gitleaks CLI binary directly (MIT licensed, free for private repos).
# The gitleaks/gitleaks-action wrapper requires a commercial license for private
# repos — this workflow avoids that by calling the binary via install script.
#
# Org baseline (always on):
#   .github/actions/secret-scan/gitleaks.toml
#   Extends Gitleaks defaults with name-independent EVM 32-byte hex rules so
#   `deployer_pk=0x<64 hex>` is caught, not only `PRIVATE_KEY=...`.
#
# Repo-level allow-listing:
#   Add .gitleaks.toml to the calling repo for false positives. Keep
#   `useDefault = true` — the action rewrites that to extend the org baseline.
#   One-off findings: .gitleaksignore fingerprints.
#   https://github.com/gitleaks/gitleaks#configuration
#
# Usage in public repos:
#   uses: m0-platform/secret-scan/.github/workflows/secret-scan.yml@main
#
# Public GitHub repos cannot call private m0-pipelines. Private callers may
# keep using m0-pipelines until that workflow wraps this repo.
###############################################################################

name: Secret Scan (Reusable)

on:
  workflow_call:
    inputs:
      gitleaks_version:
        description: "Gitleaks CLI version to install (without 'v' prefix)."
        type: string
        default: "8.24.2"
      config_path:
        description: "Path to a repo-level .gitleaks.toml allow-list (relative to repo root)."
        type: string
        default: ".gitleaks.toml"
      fail_on_findings:
        description: "Exit non-zero (fail the job) if secrets are detected."
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  gitleaks:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        # actions/checkout v4.3.1
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false

      # $/ resolves to this repo at the same commit the caller pinned — required
      # so the org gitleaks.toml next to the composite is the one they asked for.
      - name: Run Gitleaks
        uses: $/.github/actions/secret-scan
        with:
          gitleaks_version: ${{ inputs.gitleaks_version }}
          config_path: ${{ inputs.config_path }}
          fail_on_findings: ${{ inputs.fail_on_findings }}

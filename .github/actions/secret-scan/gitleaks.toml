###############################################################################
# M0 org Gitleaks baseline
#
# Applied by .github/actions/secret-scan to every calling repo. A --config file
# REPLACES the upstream rule set, so useDefault is mandatory.
#
# Why the extra rules: upstream `generic-api-key` is SEMI-generic. It fires only
# when the identifier contains access/api/auth/credential/key/password/secret/
# token. `PRIVATE_KEY=0x<64 hex>` is caught; `deployer_pk=0x<64 hex>` is not.
# These rules match the 32-byte hex shape itself.
#
# A private key and a keccak256 / sha256 digest are identical in shape. That is
# deliberate: new 32-byte literals are reviewed once, then removed or
# allow-listed in the repo's .gitleaks.toml / .gitleaksignore.
#
# Repo-level .gitleaks.toml is still supported: the action makes that file
# extend THIS baseline (allow-lists only — do not copy these rules).
###############################################################################

title = "m0 org gitleaks"

[extend]
useDefault = true

# Public EVM addresses (20 bytes) are on-chain data, not credentials.
# regexTarget = "secret" so a line that also contains a 32-byte key is not
# cleared just because an address appears somewhere on it.
[allowlist]
description = "Public EVM addresses and universally public 32-byte values"
regexTarget = "secret"
regexes = [
  '''^0x[0-9a-fA-F]{40}$''',
  # Anvil/Hardhat account #0 key (Foundry docs).
  '''^0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80$''',
  # bytes32(0) / DEFAULT_ADMIN_ROLE and 0x..01 dummy keys.
  '''^0x0{63}[01]$''',
  # 1Password references. `op run` injects the secret at runtime.
  '''^op://\S+$''',
]

[[rules]]
id = "evm-32-byte-hex"
description = "32-byte hex literal (0x + 64 hex) — possible EVM private key"
regex = '''\b0x[0-9a-fA-F]{64}\b'''
keywords = ["0x"]

[rules.allowlist]
description = "Universally public 32-byte values"
regexTarget = "secret"
regexes = [
  # Anvil/Hardhat account #0 key (address 0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266).
  # Published in the Foundry docs; used in tests so privateKeyToAccount succeeds.
  '''^0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80$''',
  # bytes32(0) — DEFAULT_ADMIN_ROLE — and the 0x..01 dummy PRIVATE_KEY in tests.
  '''^0x0{63}[01]$''',
]

# Keys are often written WITHOUT the 0x prefix in .env files
# (deployer_pk=4c0883...), which the rule above cannot see.
[[rules]]
id = "bare-32-byte-hex"
description = "32-byte hex literal without 0x prefix — possible EVM private key"
regex = '''\b[0-9a-fA-F]{64}\b'''

[rules.allowlist]
description = "Lockfiles, checksum manifests, and bytes32(0)/0x..01 without 0x prefix"
regexTarget = "secret"
regexes = [
  '''^0{63}[01]$''',
]
paths = [
  '''(^|/)package-lock\.json$''',
  '''(^|/)npm-shrinkwrap\.json$''',
  '''(^|/)yarn\.lock$''',
  '''(^|/)pnpm-lock\.yaml$''',
  '''(^|/)bun\.lockb?$''',
  '''(^|/)Cargo\.lock$''',
  '''(^|/)go\.sum$''',
  '''(^|/)composer\.lock$''',
  '''(^|/)poetry\.lock$''',
  '''(^|/)uv\.lock$''',
  '''(^|/)Gemfile\.lock$''',
  '''(^|/)flake\.lock$''',
  '''(^|/)\.terraform\.lock\.hcl$''',
]

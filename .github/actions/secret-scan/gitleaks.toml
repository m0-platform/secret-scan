###############################################################################
# M0 org Gitleaks baseline
#
# Applied by .github/actions/secret-scan to every calling repo. A --config file
# REPLACES the upstream rule set, so useDefault is mandatory.
#
# Why the extra rules: upstream `generic-api-key` is SEMI-generic. It fires only
# when the identifier contains access/api/auth/credential/key/password/secret/
# token. `PRIVATE_KEY=0x<64 hex>` is caught; `deployer_pk=0x<64 hex>` is not.
# These rules match the 32-byte hex shape itself.
#
# A private key and a keccak256 / sha256 digest are identical in shape. That is
# deliberate: new 32-byte literals are reviewed once, then removed or
# allow-listed in the repo's .gitleaks.toml / .gitleaksignore.
#
# Repo-level .gitleaks.toml is still supported: the action makes that file
# extend THIS baseline (allow-lists only — do not copy these rules).
###############################################################################

title = "m0 org gitleaks"

[extend]
useDefault = true

# Public EVM addresses (20 bytes) are on-chain data, not credentials.
# regexTarget = "secret" so a line that also contains a 32-byte key is not
# cleared just because an address appears somewhere on it.
# Keep a single [allowlist]. Gitleaks 8.24 (the version the action installs)
# only applies that global block. A second [[allowlists]] is ignored there,
# and 8.30 refuses to load both forms together.
[allowlist]
description = "Public EVM addresses and 1Password refs"
regexTarget = "secret"
regexes = [
  '''^0x[0-9a-fA-F]{40}$''',
  # Anvil/Hardhat account #0 key (Foundry docs).
  '''(?i)^0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80$''',
  # bytes32(0) / DEFAULT_ADMIN_ROLE and 0x..01 dummy keys.
  '''^0x0{63}[01]$''',
  # bytes32(type(uint256).max). Used as a mock return, not a key.
  '''(?i)^0xf{64}$''',
  # 1Password references. `op run` injects the secret at runtime.
  '''^op://\S+$''',
  # EIP-1967 implementation and admin slots.
  '''(?i)^0x360894a13ba1a3210667c828492db98dca3e2076cc3735a920a3ca505d382bbc$''',
  '''(?i)^0xb53127684a568b3173ae13b9f8a6016e243e63b6e8ee1178d6a717850b5d6103$''',
  # EIP-712 domain typehash.
  '''(?i)^0x8b73c3c69bb8fe3d512ecc4cf759cc79239f7b179b0ffacaa9a75d522b39400f$''',
  # secp256k1n / 2, the ECDSA lower-s bound.
  '''(?i)^0x7fffffffffffffffffffffffffffffff5d576e7357a4501ddfe92f46681b20a0$''',
  # secp256k1n, the curve order.
  '''(?i)^0xfffffffffffffffffffffffffffffffebaaedce6af48a03bbfd25e8cd0364141$''',
  # Highest-bit mask used to split a compact ECDSA signature. Not a key.
  '''(?i)^0x7f{63}$''',
  # keccak256("1"), the EIP-712 version hash.
  '''(?i)^0xc89efdaa54c0f20c7adf612882df0950f5a951637e0307cdcb4c672f298b8bc6$''',
  # EIP-1967 beacon slot.
  '''(?i)^0xa3f0ad74e5423aebfd80d3ef4346578335a9a72aeaee59ff6cb3582b35133d50$''',
  # Wormhole devnet guardian and ganache keys. Published in wormhole-foundation/wormhole scripts/devnet-consts.json.
  '''(?i)^0x00d39587c3556f289677a837c7f3c0817cb7541ce6e38a243a4bdc761d534c5e$''',

[[rules]]
id = "evm-32-byte-hex"
description = "32-byte hex literal (0x + 64 hex) — possible EVM private key"
# The match includes a short prefix so the typehash allowlist can see a name
# on the previous line. secretGroup keeps the finding value as the hex only.
regex = '''(?s).{0,240}?(\b0x[0-9a-fA-F]{64}\b)'''
secretGroup = 1
keywords = ["0x"]

# Rule allowlists are a list, so each one can use its own regexTarget.
# The global [allowlist] cannot: 8.24 applies only one global block.
[[rules.allowlists]]
description = "Universally public 32-byte values"
regexTarget = "secret"
regexes = [
  # Anvil/Hardhat account #0 key (address 0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266).
  # Published in the Foundry docs; used in tests so privateKeyToAccount succeeds.
  '''(?i)^0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80$''',
  # bytes32(0) — DEFAULT_ADMIN_ROLE — and the 0x..01 dummy PRIVATE_KEY in tests.
  '''^0x0{63}[01]$''',
]

# regexTarget = "match" sees the prefix captured above, including
# `bytes32 ... TYPEHASH =\n    0x<64>`. The hex under test is at the end of
# the match, so a PRIVATE_KEY written the same way stays a finding.
# `bytes32` or `uint256` is required so a comment that merely says
# TYPEHASH = 0x<64> is still reported. Names are the structural ones:
# TYPEHASH, STORAGE_LOCATION, VERSION_HASH, *_LOCATION, *_SLOT, *_DOMAIN_HASH, *Location.
[[rules.allowlists]]
description = "EIP-712 typehashes, ERC-7201 slots, and EIP-1967 slots"
regexTarget = "match"
regexes = [
  '''(?is)(?:bytes32|uint256)\b.{0,240}?(?:TYPEHASH|STORAGE_LOCATION|VERSION_HASH|_LOCATION|_SLOT|_DOMAIN_HASH|Location)\b\s*=\s*0x[0-9a-fA-F]{64}\b\s*$''',
]

# Event topic0 hashes in comments. The word Topic0 has to sit against the hex,
# so a private key later in the file is not cleared by an earlier topic.
[[rules.allowlists]]
description = "Event signature topic0 hashes"
regexTarget = "match"
regexes = [
  '''(?is)Topic0\b(?:\s|/){0,40}0x[0-9a-fA-F]{64}\b\s*$''',
]
# Path skip for this rule only. Upstream rules still scan these files, so a
# named key committed under broadcast/ remains a finding.
[[rules.allowlists]]
description = "Foundry broadcast artifacts for the 0x 32-byte rule"
paths = [
  '''(^|/)broadcast/''',
  '''(^|/)broadcast\.log\.json$''',
  '''(^|/)forge-std/''',
  '''(^|/)solmate/''',
]

# Keys are often written WITHOUT the 0x prefix in .env files
# (deployer_pk=4c0883...), which the rule above cannot see.
[[rules]]
id = "bare-32-byte-hex"
description = "32-byte hex literal without 0x prefix — possible EVM private key"
regex = '''\b[0-9a-fA-F]{64}\b'''

[[rules.allowlists]]
description = "Lockfiles, Foundry broadcast artifacts, and bytes32(0)/0x..01 without 0x prefix"
regexTarget = "secret"
regexes = [
  '''^0{63}[01]$''',
]
paths = [
  '''(^|/)broadcast/''',
  '''(^|/)broadcast\.log\.json$''',
  '''(^|/)forge-std/''',
  '''(^|/)solmate/''',
  '''(^|/)package-lock\.json$''',
  '''(^|/)npm-shrinkwrap\.json$''',
  '''(^|/)yarn\.lock$''',
  '''(^|/)pnpm-lock\.yaml$''',
  '''(^|/)bun\.lockb?$''',
  '''(^|/)Cargo\.lock$''',
  '''(^|/)go\.sum$''',
  '''(^|/)composer\.lock$''',
  '''(^|/)poetry\.lock$''',
  '''(^|/)uv\.lock$''',
  '''(^|/)Gemfile\.lock$''',
  '''(^|/)flake\.lock$''',
  '''(^|/)\.terraform\.lock\.hcl$''',
]

# Image digests and Git LFS pointers. The 64 hex chars are a content hash
# sitting next to sha256:, not a key. A bare hex without that prefix still fails.
[[rules.allowlists]]
description = "sha256 image digests and Git LFS oids"
regexTarget = "line"
regexes = [
  '''(?i)sha256:[0-9a-f]{64}''',
]

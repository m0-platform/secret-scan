###############################################################################
# Copy to YOUR_REPO/.github/workflows/security.yml
#
# Public repos must call m0-platform/secret-scan (this repo). They cannot call
# private m0-pipelines — GitHub rejects public → private reusable workflows.
###############################################################################

name: Security

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  schedule:
    - cron: "0 3 1 * *"
  workflow_dispatch:

jobs:
  secret-scan:
    permissions:
      contents: read
    uses: m0-platform/secret-scan/.github/workflows/secret-scan.yml@main
